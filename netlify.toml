[build]
  command = "npm run build"
  ignore = "node scripts/netlify-ignore-build.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep the staging hostname out of search and consolidate any existing signals.
[[redirects]]
  from = "https://stage.alphatrack.digital/*"
  to = "https://alphatrack.digital/:splat"
  status = 301
  force = true

# API requests → Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Every public route is prerendered; unknown URLs remain real 404 responses.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

# Long-lived cache for hashed static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No caching for HTML — ensures fresh deploys are picked up immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
