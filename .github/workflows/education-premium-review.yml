name: Education Premium LP Review

on:
  push:
    branches:
      - qa/education-premium-review-v5

permissions:
  contents: read

concurrency:
  group: education-premium-review
  cancel-in-progress: true

jobs:
  deploy-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      WORKER_NAME: atd-website-education-review
      SOURCE_PR_SHA: a204941c9372827f4c1f76f9bf40ab298d4e113e
      LOCKED_PRO_SHA: 2fe7b25f9e27799c7753e556facf9bb03210b2ac
      REVIEW_BASE_URL: https://atd-website-education-review.alphatrackdigital.workers.dev

    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Education source and locked Professional baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_PR_SHA" HEAD
          git diff --exit-code "$LOCKED_PRO_SHA" -- src/pages/TrackingAuditProfessionalServices.tsx
          git diff --exit-code "$LOCKED_PRO_SHA" -- src/pages/TrackingLandingPage.tsx
          echo "Education feature source preserved at $SOURCE_PR_SHA"
          echo "Education source preserved; updated Professional Services baseline preserved; General Tracking Audit source unchanged."
          echo "Review wrapper head is $(git rev-parse HEAD)"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical release preparation
        env:
          VITE_LEADS_ENDPOINT: /api/leads
        run: npm run release:prepare

      - name: Install Chromium for visual regression
        run: npx playwright install --with-deps chromium

      - name: Verify Education visual and submission contract
        run: npx playwright test e2e/tracking-audit-education.visual.spec.ts

      - name: Embed review deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const manifest = {
            schemaVersion: 1,
            app: 'atd-website',
            environment: 'temporary-review',
            reviewPurpose: 'Premium Education Tracking Audit LP',
            sourcePr: 59,
            sourcePrSha: process.env.SOURCE_PR_SHA,
            lockedProfessionalServicesSha: process.env.LOCKED_PRO_SHA,
            wrapperSha: process.env.GITHUB_SHA,
            workerName: process.env.WORKER_NAME,
            formSubmissionEnabled: false,
            builtAt: new Date().toISOString(),
            githubRun: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          fs.mkdirSync('dist/__atd', { recursive: true });
          fs.writeFileSync('dist/__atd/deployment.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Cloudflare dry-run
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.education-review.jsonc --outdir .wrangler-dry-run

      - name: Deploy isolated review Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.education-review.jsonc 2>&1 | tee cloudflare-review-deploy.log

      - name: Smoke Education route and blocked submit endpoint
        shell: bash
        run: |
          set -euo pipefail

          code="000"
          for route_attempt in 1 2 3 4 5 6 7 8
          do
            code="$(curl -sS -o /tmp/review-body -w '%{http_code}' -H 'Accept: text/html' -H 'Sec-Fetch-Mode: navigate' -H 'Cache-Control: no-cache' "$REVIEW_BASE_URL/offer/tracking-audit/education/")"
            echo "/offer/tracking-audit/education/ -> $code (attempt $route_attempt)"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 2
          done
          test "$code" = "200"

          for attempt in 1 2 3 4 5 6
          do
            curl -sS -H 'Cache-Control: no-cache'               "$REVIEW_BASE_URL/__atd/deployment.json?sha=$SOURCE_PR_SHA&attempt=$attempt" > /tmp/review-manifest-current || true
            if grep -q "$SOURCE_PR_SHA" /tmp/review-manifest-current; then
              echo "Latest review manifest visible on attempt $attempt"
              break
            fi
            sleep 2
          done
          grep -q "$SOURCE_PR_SHA" /tmp/review-manifest-current

          curl -sS -H 'Accept: text/html' -H 'Sec-Fetch-Mode: navigate' -H 'Cache-Control: no-cache'             "$REVIEW_BASE_URL/offer/tracking-audit/education/?review_sha=$SOURCE_PR_SHA" > /tmp/initial-html

          grep -q "Know which campaigns drive" /tmp/initial-html
          grep -q "applications" /tmp/initial-html
          grep -q "and enrolments." /tmp/initial-html
          grep -q "An application can lose its source" /tmp/initial-html
          grep -q "before your admissions team ever sees it." /tmp/initial-html
          grep -q "One institution. One website. One recruitment journey." /tmp/initial-html
          grep -q "Reports 18 leads." /tmp/initial-html
          grep -q "Shows 12 applications." /tmp/initial-html
          grep -q "Receives 15 applications." /tmp/initial-html
          grep -q "Human-reviewed audit" /tmp/initial-html
          grep -q "actually producing applications." /tmp/initial-html

          if grep -q "Know which ads drive" /tmp/initial-html; then
            echo "Professional Services hero leaked into Education prerender"
            exit 1
          fi
          if grep -q "Growth should never" /tmp/initial-html; then
            echo "Homepage prerender leaked into Education route"
            exit 1
          fi

          manifest_code="$(curl -sS -o /tmp/review-manifest -w '%{http_code}' "$REVIEW_BASE_URL/__atd/deployment.json")"
          echo "/__atd/deployment.json -> $manifest_code"
          test "$manifest_code" = "200"

          submit_code="$(curl -sS -o /tmp/submit-body -w '%{http_code}' "$REVIEW_BASE_URL/api/leads")"
          echo "/api/leads -> $submit_code"
          cat /tmp/submit-body
          test "$submit_code" = "403"

      - name: Save review evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          cp dist/__atd/deployment.json qa-evidence/deployment.json 2>/dev/null || true
          cp cloudflare-review-deploy.log qa-evidence/cloudflare-review-deploy.log 2>/dev/null || true
          printf '%s\n' "$SOURCE_PR_SHA" > qa-evidence/source-pr-sha.txt
          printf '%s\n' "$LOCKED_PRO_SHA" > qa-evidence/locked-professional-services-sha.txt
          printf '%s\n' "$GITHUB_SHA" > qa-evidence/review-wrapper-sha.txt

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: education-premium-review-${{ github.sha }}
          if-no-files-found: error
          path: qa-evidence
