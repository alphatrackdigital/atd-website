name: Tracking Audit responsive QA

on:
  push:
    branches:
      - feature/general-tracking-audit-application

permissions:
  contents: read

jobs:
  responsive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Tracking Audit responsive QA
        run: npx playwright test e2e/tracking-audit.responsive.spec.ts
