name: Apply Tracking Audit mobile step-position fix

on:
  push:
    branches:
      - feature/general-tracking-audit-application

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: reset mobile tracking audit step position') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/general-tracking-audit-application
          fetch-depth: 0

      - name: Apply narrow source and regression-test patch
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/TrackingLandingPage.tsx')
          text = page.read_text(encoding='utf-8')
          old = '''    setStep(2);\n  };'''
          new = '''    setStep(2);\n    window.requestAnimationFrame(() => {\n      if (window.matchMedia("(max-width: 1023px)").matches) {\n        document.getElementById("claim")?.scrollIntoView({ block: "start", behavior: "auto" });\n      }\n    });\n  };'''
          if old not in text:
              raise SystemExit('Expected handleContinue source was not found; refusing broad edit.')
          text = text.replace(old, new, 1)

          old_class = '''className="w-full rounded-2xl border border-white/10 bg-[linear-gradient(180deg,rgba(255,255,255,0.05)_0%,rgba(255,255,255,0.018)_100%)] p-4 shadow-[0_22px_70px_rgba(0,0,0,0.24)] sm:p-7 md:p-8 lg:sticky lg:top-28"'''
          new_class = '''className="w-full scroll-mt-24 rounded-2xl border border-white/10 bg-[linear-gradient(180deg,rgba(255,255,255,0.05)_0%,rgba(255,255,255,0.018)_100%)] p-4 shadow-[0_22px_70px_rgba(0,0,0,0.24)] sm:p-7 md:p-8 lg:sticky lg:top-28"'''
          if old_class not in text:
              raise SystemExit('Expected claim card class was not found; refusing broad edit.')
          page.write_text(text.replace(old_class, new_class, 1), encoding='utf-8')

          test = Path('e2e/tracking-audit.responsive.spec.ts')
          text = test.read_text(encoding='utf-8')
          old_test = '''    await expect(page.getByText("2 of 2")).toBeVisible();\n    const industry = page.getByLabel("Industry");\n    await expect(industry).toBeVisible();\n\n    const industryBox = await industry.boundingBox();'''
          new_test = '''    await expect(page.getByText("2 of 2")).toBeVisible();\n    const claim = page.locator("#claim");\n    await expect.poll(async () => (await claim.boundingBox())?.y ?? -1).toBeGreaterThanOrEqual(64);\n    const claimBox = await claim.boundingBox();\n    expect(claimBox).not.toBeNull();\n    expect(claimBox!.y).toBeLessThanOrEqual(120);\n\n    const industry = page.getByLabel("Industry");\n    await expect(industry).toBeVisible();\n\n    const industryBox = await industry.boundingBox();'''
          if old_test not in text:
              raise SystemExit('Expected responsive test source was not found; refusing broad edit.')
          test.write_text(text.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "AlphaTrack Digital"
          git config user.email "alphatrackdigital@gmail.com"
          git add src/pages/TrackingLandingPage.tsx e2e/tracking-audit.responsive.spec.ts
          git diff --cached --check
          git commit -m "fix: reset mobile tracking audit step position"
          git push origin HEAD:feature/general-tracking-audit-application
