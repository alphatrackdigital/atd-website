name: Olatunde Vertical LP Review Preview

on:
  push:
    branches:
      - qa/olatunde-vertical-lp-review

permissions:
  contents: read

concurrency:
  group: olatunde-vertical-lp-review
  cancel-in-progress: true

jobs:
  deploy-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      WORKER_NAME: atd-website-olatunde-lp-review
      SOURCE_PR_SHA: 898992fd565f64dfd3b5e17153916d857951d481
      REVIEW_BASE_URL: https://atd-website-olatunde-lp-review.alphatrackdigital.workers.dev

    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Olatunde source commit is preserved
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_PR_SHA" HEAD
          echo "Olatunde PR source preserved at $SOURCE_PR_SHA"
          echo "Review wrapper head is $(git rev-parse HEAD)"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical release preparation
        env:
          VITE_LEADS_ENDPOINT: /api/leads
        run: npm run release:prepare

      - name: Embed review deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const manifest = {
            schemaVersion: 1,
            app: 'atd-website',
            environment: 'temporary-review',
            reviewPurpose: 'Olatunde Professional Services and Education Tracking Audit LPs',
            sourcePr: 55,
            sourcePrSha: process.env.SOURCE_PR_SHA,
            wrapperSha: process.env.GITHUB_SHA,
            workerName: process.env.WORKER_NAME,
            formSubmissionEnabled: false,
            builtAt: new Date().toISOString(),
            githubRun: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          fs.mkdirSync('dist/__atd', { recursive: true });
          fs.writeFileSync('dist/__atd/deployment.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Cloudflare dry-run
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.olatunde-review.jsonc --outdir .wrangler-dry-run

      - name: Deploy isolated review Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.olatunde-review.jsonc 2>&1 | tee cloudflare-review-deploy.log

      - name: Smoke review routes and blocked submit endpoint
        shell: bash
        run: |
          set -euo pipefail
          for path in             /offer/tracking-audit/professional-services/             /offer/tracking-audit/education/             /__atd/deployment.json
          do
            code="$(curl -sS -o /tmp/review-body -w '%{http_code}' "$REVIEW_BASE_URL$path")"
            echo "$path -> $code"
            test "$code" = "200"
          done

          submit_code="$(curl -sS -o /tmp/submit-body -w '%{http_code}' "$REVIEW_BASE_URL/api/leads")"
          echo "/api/leads -> $submit_code"
          cat /tmp/submit-body
          test "$submit_code" = "403"

      - name: Save review evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          cp dist/__atd/deployment.json qa-evidence/deployment.json 2>/dev/null || true
          cp cloudflare-review-deploy.log qa-evidence/cloudflare-review-deploy.log 2>/dev/null || true
          printf '%s\n' "$SOURCE_PR_SHA" > qa-evidence/source-pr-sha.txt
          printf '%s\n' "$GITHUB_SHA" > qa-evidence/review-wrapper-sha.txt

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olatunde-vertical-lp-review-${{ github.sha }}
          if-no-files-found: error
          path: qa-evidence
