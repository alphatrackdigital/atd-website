name: PR release gate

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: PR release gate
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require owner approval for external contributors
        if: github.event.pull_request.user.login != 'alphatrackdigital'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const approvedCurrentHead = reviews.some((review) =>
              review.user?.login === 'alphatrackdigital' &&
              review.state === 'APPROVED' &&
              review.commit_id === pr.head.sha
            );

            if (!approvedCurrentHead) {
              core.setFailed(
                'External-contributor PRs require approval from @alphatrackdigital on the current head commit before merge.'
              );
            }

      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run release:prepare
