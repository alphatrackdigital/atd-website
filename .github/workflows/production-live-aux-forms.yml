name: Production Live Auxiliary Forms E2E
on:
  push:
    branches:
      - qa/production-live-aux-forms-v1
    paths:
      - ".github/workflows/production-live-aux-forms.yml"
      - "playwright.live-aux.config.ts"
      - "e2e/production-live-aux-forms.spec.ts"
permissions:
  contents: read
concurrency:
  group: production-live-aux-forms-e2e
  cancel-in-progress: true
jobs:
  live-aux-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run controlled real production auxiliary form journeys
        run: npx playwright test --config=playwright.live-aux.config.ts
      - name: Upload redacted journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-live-aux-forms-${{ github.sha }}
          path: |
            contact-live-e2e.json
            newsletter-live-e2e.json
            exit-live-e2e.json
            test-results/
          if-no-files-found: ignore
          retention-days: 30
