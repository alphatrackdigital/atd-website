name: Tracking Audit Beta Application UAT

on:
  push:
    branches:
      - qa/tracking-audit-beta-application-uat-v4

permissions:
  contents: read

concurrency:
  group: tracking-audit-beta-application-uat
  cancel-in-progress: true

jobs:
  application-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: 176723ed08fa5e816ba04b11f28df4ee05e8ae51
      BETA_V3_SHA: 855f18f29514c68c7d00e9d75630ab84f022ac35
      BACKEND_RELEASE_SHA: da830acc4c882ab2d36a4c39a4ca0e8a47cd3214
      STAGING_DEPLOYED_SHA: caaa97a16050cb1597e260f3e6217ca9582924d7
      STAGING_READINESS_URL: https://atd-backend-test-git-staging-alphatrackdigital.vercel.app/api/qa-readiness
      BACKEND_REPO_URL: https://github.com/alphatrackdigital/atd-backend-test.git

    steps:
      - name: Check out UAT wrapper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact Beta application source
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git merge-base --is-ancestor "$BETA_V3_SHA" "$SOURCE_SHA"

          mapfile -t wrapper_files < <(git diff --name-only "$SOURCE_SHA" HEAD)
          test "${#wrapper_files[@]}" -eq 1
          test "${wrapper_files[0]}" = ".github/workflows/tracking-audit-beta-application-uat.yml"

          expected_files="$(printf '%s\n' \
            e2e/tracking-audit-beta-application-uat.spec.ts \
            src/pages/TrackingAuditEducation.tsx \
            src/pages/TrackingAuditProfessionalServices.tsx \
            src/pages/TrackingAuditRealEstate.tsx \
            src/pages/TrackingLandingPage.tsx \
            src/types/leads.ts | sort)"
          actual_files="$(git diff --name-only "$BETA_V3_SHA" "$SOURCE_SHA" | sort)"
          test "$actual_files" = "$expected_files"

          echo "UAT source: $SOURCE_SHA"
          echo "Beta v3 parent: $BETA_V3_SHA"
          echo "Released backend main: $BACKEND_RELEASE_SHA"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical release preparation
        env:
          VITE_LEADS_ENDPOINT: /api/leads
        run: npm run release:prepare

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run four-LP application contract UAT
        run: |
          npx playwright test \
            e2e/tracking-audit-beta-application-uat.spec.ts \
            e2e/tracking-audit.responsive.spec.ts \
            e2e/tracking-audit-professional-services.visual.spec.ts \
            e2e/tracking-audit-education.visual.spec.ts \
            e2e/tracking-audit-real-estate.visual.spec.ts \
            e2e/tracking-audit-discovery.visual.spec.ts

      - name: Verify protected Vercel staging without submitting a lead
        shell: bash
        run: |
          set -euo pipefail

          staging_branch_sha="$(git ls-remote "$BACKEND_REPO_URL" refs/heads/staging | awk '{print $1}')"
          echo "backend_staging_sha=$staging_branch_sha"
          test "$staging_branch_sha" = "$STAGING_DEPLOYED_SHA"

          curl -fsSL             "https://raw.githubusercontent.com/alphatrackdigital/atd-backend-test/$STAGING_DEPLOYED_SHA/api/qa-readiness.ts"             -o /tmp/qa-readiness.ts
          curl -fsSL             "https://raw.githubusercontent.com/alphatrackdigital/atd-backend-test/$STAGING_DEPLOYED_SHA/api/_lib/trackingAuditHandler.ts"             -o /tmp/trackingAuditHandler.ts

          grep -q 'req.method !== "GET"' /tmp/qa-readiness.ts
          grep -q 'normalizeRoute(data.websiteRoute)' /tmp/trackingAuditHandler.ts
          grep -q 'WEBSITE_ROUTE: getSubmittedRoute(data)' /tmp/trackingAuditHandler.ts

          staging_status="$(curl -sS             -D /tmp/staging-protection-headers.txt             -o /tmp/staging-protection-body.txt             -w '%{http_code}'             "$STAGING_READINESS_URL")"

          echo "staging_readiness_status=$staging_status"
          cat /tmp/staging-protection-headers.txt
          cat /tmp/staging-protection-body.txt

          test "$staging_status" = "302"
          grep -qi '^server: Vercel' /tmp/staging-protection-headers.txt
          grep -qi '^location: https://vercel.com/sso-api?' /tmp/staging-protection-headers.txt
          grep -qi '^x-robots-tag: noindex' /tmp/staging-protection-headers.txt
          grep -q 'Redirecting' /tmp/staging-protection-body.txt

      - name: Save UAT evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          printf '%s\n' "$SOURCE_SHA" > qa-evidence/frontend-source-sha.txt
          printf '%s\n' "$BETA_V3_SHA" > qa-evidence/beta-v3-sha.txt
          printf '%s\n' "$BACKEND_RELEASE_SHA" > qa-evidence/backend-release-sha.txt
          printf '%s\n' "$STAGING_DEPLOYED_SHA" > qa-evidence/vercel-staging-deployed-sha.txt
          printf '%s\n' "$STAGING_READINESS_URL" > qa-evidence/staging-readiness-endpoint.txt
          cp /tmp/staging-protection-headers.txt qa-evidence/staging-protection-headers.txt 2>/dev/null || true
          cp /tmp/staging-protection-body.txt qa-evidence/staging-protection-body.txt 2>/dev/null || true
          cp /tmp/qa-readiness.ts qa-evidence/deployed-qa-readiness.ts 2>/dev/null || true
          grep -n 'websiteRoute\|WEBSITE_ROUTE' /tmp/trackingAuditHandler.ts             > qa-evidence/deployed-website-route-contract.txt 2>/dev/null || true

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-audit-beta-application-uat-${{ github.sha }}
          if-no-files-found: error
          path: qa-evidence
