name: Tracking Audit Release Candidate Review

on:
  push:
    branches:
      - qa/tracking-audit-release-candidate-v1

permissions:
  contents: read

concurrency:
  group: tracking-audit-release-candidate-review
  cancel-in-progress: true

jobs:
  release-candidate-review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      WORKER_NAME: atd-website-tracking-audit-release-review
      RELEASE_SHA: 73d5d0426b7eef8cc369a783608a15ac864995a2
      MAIN_SHA: a29c48b091299dccc56a309affe92ee2110f6d61
      BETA_V4_SHA: 176723ed08fa5e816ba04b11f28df4ee05e8ae51
      RELEASE_TREE: 3dc2bb55cd0aba919d036a5e763ef94372764670
      REVIEW_BASE_URL: https://atd-website-tracking-audit-release-review.alphatrackdigital.workers.dev

    steps:
      - name: Check out release review wrapper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          git merge-base --is-ancestor "$MAIN_SHA" "$RELEASE_SHA"

          actual_tree="$(git rev-parse "$RELEASE_SHA^{tree}")"
          beta_tree="$(git rev-parse "$BETA_V4_SHA^{tree}")"
          echo "release_sha=$RELEASE_SHA"
          echo "release_tree=$actual_tree"
          echo "beta_v4_tree=$beta_tree"
          test "$actual_tree" = "$RELEASE_TREE"
          test "$actual_tree" = "$beta_tree"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical release preparation
        env:
          VITE_LEADS_ENDPOINT: /api/leads
        run: npm run release:prepare

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete Tracking Audit browser gate
        run: |
          npx playwright test             e2e/tracking-audit-beta-application-uat.spec.ts             e2e/tracking-audit.responsive.spec.ts             e2e/tracking-audit-professional-services.visual.spec.ts             e2e/tracking-audit-education.visual.spec.ts             e2e/tracking-audit-real-estate.visual.spec.ts             e2e/tracking-audit-discovery.visual.spec.ts

      - name: Embed release review manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const manifest = {
            schemaVersion: 1,
            app: 'atd-website',
            environment: 'tracking-audit-release-review',
            releaseSha: process.env.RELEASE_SHA,
            mainSha: process.env.MAIN_SHA,
            betaV4Sha: process.env.BETA_V4_SHA,
            releaseTree: process.env.RELEASE_TREE,
            wrapperSha: process.env.GITHUB_SHA,
            workerName: process.env.WORKER_NAME,
            formSubmissionEnabled: false,
            builtAt: new Date().toISOString(),
            githubRun: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          fs.mkdirSync('dist/__atd', { recursive: true });
          fs.writeFileSync('dist/__atd/deployment.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Cloudflare dry-run
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.tracking-audit-release-review.jsonc --outdir .wrangler-dry-run

      - name: Deploy release review Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.tracking-audit-release-review.jsonc 2>&1 | tee cloudflare-release-review.log

      - name: Smoke all Tracking Audit routes
        shell: bash
        run: |
          set -euo pipefail

          smoke_route () {
            local route="$1"
            local text_a="$2"
            local text_b="$3"
            local code="000"

            for attempt in 1 2 3 4 5 6
            do
              code="$(curl -sS -o /tmp/route-body -w '%{http_code}'                 -H 'Accept: text/html'                 -H 'Sec-Fetch-Mode: navigate'                 -H 'Cache-Control: no-cache'                 "$REVIEW_BASE_URL$route?release=$RELEASE_SHA")"
              echo "$route -> $code (attempt $attempt)"
              if [ "$code" = "200" ]; then break; fi
              sleep 2
            done
            test "$code" = "200"
            grep -q "$text_a" /tmp/route-body
            grep -q "$text_b" /tmp/route-body
          }

          smoke_route "/offer/tracking-audit/" "Know what your marketing is" "actually producing."
          smoke_route "/offer/tracking-audit/professional-services/" "Know which ads drive" "real enquiries"
          smoke_route "/offer/tracking-audit/education/" "Know which campaigns drive" "applications"
          smoke_route "/offer/tracking-audit/real-estate/" "Know which ads drive" "property enquiries"

          for attempt in 1 2 3 4 5 6
          do
            curl -sS -H 'Cache-Control: no-cache' "$REVIEW_BASE_URL/__atd/deployment.json?sha=$RELEASE_SHA&attempt=$attempt" > /tmp/manifest || true
            if grep -q "$RELEASE_SHA" /tmp/manifest; then
              echo "Latest release manifest visible on attempt $attempt"
              break
            fi
            sleep 2
          done

          grep -q "$RELEASE_SHA" /tmp/manifest
          grep -q "$RELEASE_TREE" /tmp/manifest

          manifest_code="$(curl -sS -o /tmp/manifest-final -w '%{http_code}' "$REVIEW_BASE_URL/__atd/deployment.json")"
          echo "/__atd/deployment.json -> $manifest_code"
          test "$manifest_code" = "200"

          submit_code="$(curl -sS -o /tmp/submit-body -w '%{http_code}' "$REVIEW_BASE_URL/api/leads")"
          echo "/api/leads -> $submit_code"
          test "$submit_code" = "403"

      - name: Save release evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          cp dist/__atd/deployment.json qa-evidence/deployment.json 2>/dev/null || true
          cp cloudflare-release-review.log qa-evidence/cloudflare-release-review.log 2>/dev/null || true
          printf '%s\n' "$RELEASE_SHA" > qa-evidence/release-sha.txt
          printf '%s\n' "$RELEASE_TREE" > qa-evidence/release-tree.txt
          printf '%s\n' "$GITHUB_SHA" > qa-evidence/wrapper-sha.txt

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-audit-release-review-${{ github.sha }}
          if-no-files-found: error
          path: qa-evidence
