name: Professional Services Premium LP Review

on:
  push:
    branches:
      - qa/professional-services-premium-review-v29

permissions:
  contents: read

concurrency:
  group: professional-services-premium-review
  cancel-in-progress: true

jobs:
  deploy-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      WORKER_NAME: atd-website-prof-services-review
      SOURCE_PR_SHA: e2442e72a45270bd218d9053805a3d894a5d2191
      REVIEW_BASE_URL: https://atd-website-prof-services-review.alphatrackdigital.workers.dev

    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Professional Services source commit is preserved
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_PR_SHA" HEAD
          echo "Professional Services feature source preserved at $SOURCE_PR_SHA"
          echo "Review wrapper head is $(git rev-parse HEAD)"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical release preparation
        env:
          VITE_LEADS_ENDPOINT: /api/leads
        run: npm run release:prepare

      - name: Install Chromium for visual regression
        run: npx playwright install --with-deps chromium

      - name: Verify desktop, tablet and mobile visual stability
        run: npx playwright test e2e/tracking-audit-professional-services.visual.spec.ts

      - name: Embed review deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const manifest = {
            schemaVersion: 1,
            app: 'atd-website',
            environment: 'temporary-review',
            reviewPurpose: 'Premium Professional Services Tracking Audit LP',
            sourcePr: 58,
            sourcePrSha: process.env.SOURCE_PR_SHA,
            wrapperSha: process.env.GITHUB_SHA,
            workerName: process.env.WORKER_NAME,
            formSubmissionEnabled: false,
            builtAt: new Date().toISOString(),
            githubRun: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          fs.mkdirSync('dist/__atd', { recursive: true });
          fs.writeFileSync('dist/__atd/deployment.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Cloudflare dry-run
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.professional-services-review.jsonc --outdir .wrangler-dry-run

      - name: Deploy isolated review Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.professional-services-review.jsonc 2>&1 | tee cloudflare-review-deploy.log

      - name: Smoke review routes and blocked submit endpoint
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/review-body -w '%{http_code}' -H 'Accept: text/html' -H 'Sec-Fetch-Mode: navigate' "$REVIEW_BASE_URL/offer/tracking-audit/professional-services/")"
          echo "/offer/tracking-audit/professional-services/ -> $code"
          test "$code" = "200"

          for attempt in 1 2 3 4 5 6
          do
            curl -sS -H 'Cache-Control: no-cache' "$REVIEW_BASE_URL/__atd/deployment.json?sha=$SOURCE_PR_SHA&attempt=$attempt" > /tmp/review-manifest-current || true
            if grep -q "$SOURCE_PR_SHA" /tmp/review-manifest-current; then
              echo "Latest review manifest visible on attempt $attempt"
              break
            fi
            sleep 2
          done
          grep -q "$SOURCE_PR_SHA" /tmp/review-manifest-current

          curl -sS -H 'Accept: text/html' -H 'Sec-Fetch-Mode: navigate' -H 'Cache-Control: no-cache' "$REVIEW_BASE_URL/offer/tracking-audit/professional-services/?review_sha=$SOURCE_PR_SHA" > /tmp/initial-html
          grep -q "Know which ads drive" /tmp/initial-html
          if grep -q "Illustrative example — not client data." /tmp/initial-html; then exit 1; fi
          grep -q "Reports 14 leads." /tmp/initial-html
          grep -q "Shows 9 conversions." /tmp/initial-html
          grep -q "Receives 11 enquiries." /tmp/initial-html
          if grep -q "Illustrative preview" /tmp/initial-html; then exit 1; fi
          if grep -q "Example preview" /tmp/initial-html; then exit 1; fi
          grep -q "Tracking Health Scorecard" /tmp/initial-html
          grep -q "From application to scorecard in four steps." /tmp/initial-html
          grep -q "Human-reviewed audit" /tmp/initial-html
          if grep -q "Growth should never" /tmp/initial-html; then exit 1; fi

          manifest_code="$(curl -sS -o /tmp/review-manifest -w '%{http_code}' "$REVIEW_BASE_URL/__atd/deployment.json")"
          echo "/__atd/deployment.json -> $manifest_code"
          test "$manifest_code" = "200"

          submit_code="$(curl -sS -o /tmp/submit-body -w '%{http_code}' "$REVIEW_BASE_URL/api/leads")"
          echo "/api/leads -> $submit_code"
          cat /tmp/submit-body
          test "$submit_code" = "403"

      - name: Save review evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          cp dist/__atd/deployment.json qa-evidence/deployment.json 2>/dev/null || true
          cp cloudflare-review-deploy.log qa-evidence/cloudflare-review-deploy.log 2>/dev/null || true
          printf '%s\n' "$SOURCE_PR_SHA" > qa-evidence/source-pr-sha.txt
          printf '%s\n' "$GITHUB_SHA" > qa-evidence/review-wrapper-sha.txt

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-services-premium-review-${{ github.sha }}
          if-no-files-found: error
          path: qa-evidence
