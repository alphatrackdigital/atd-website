name: Tracking Audit UAT Record Verification

on:
  push:
    branches:
      - qa/tracking-audit-live-uat-20260831

permissions:
  contents: read

jobs:
  verify-records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_BASE_URL: https://atd-website-qa.alphatrackdigital.workers.dev
      TEST_EMAIL: alphatrackdigital+tracking-audit-uat-20260831-01@gmail.com

    steps:
      - name: Check out disposable UAT branch
        uses: actions/checkout@v4

      - name: Fetch fixed QA record probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uat-record-evidence
          STATUS="$(curl -sS -o uat-record-evidence/brevo-records.json -w '%{http_code}'             "$QA_BASE_URL/api/leads?atd_qa_probe=uat_records")"
          echo "probe_status=$STATUS"
          cat uat-record-evidence/brevo-records.json
          test "$STATUS" = "200"

      - name: Verify Brevo contact task and email lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const probe = JSON.parse(fs.readFileSync('uat-record-evidence/brevo-records.json', 'utf8'));
          const a = probe.contact?.attributes || {};
          const listIds = Array.isArray(probe.contact?.listIds) ? probe.contact.listIds : [];
          const tasks = Array.isArray(probe.tasks?.items) ? probe.tasks.items : [];
          const applicantEvents = Array.isArray(probe.emailEvents?.applicant?.events) ? probe.emailEvents.applicant.events : [];
          const auditEvents = Array.isArray(probe.emailEvents?.audit?.events) ? probe.emailEvents.audit.events : [];
          const martechEvents = Array.isArray(probe.emailEvents?.martech?.events) ? probe.emailEvents.martech.events : [];

          const hasTag = (events, tag) => events.some((event) => String(event.tag || '').includes(tag));

          const checks = {
            probeOk: probe.ok === true,
            email: probe.contact?.email === process.env.TEST_EMAIL,
            auditList: listIds.includes(11),
            firstName: a.FIRSTNAME === 'ATD',
            lastName: a.LASTNAME === 'UAT',
            company: a.COMPANY === 'ATD Tracking Audit UAT',
            website: a.WEBSITE === 'https://alphatrack.digital' || a.WEBSITE === 'alphatrack.digital',
            industry: a.AUDIT_INDUSTRY === 'professional_services',
            role: a.AUDIT_ROLE === 'founder_ceo',
            decisionInfluence: a.AUDIT_DECISION_INFLUENCE === 'final_decision_maker',
            spendBand: a.AUDIT_AD_SPEND_BAND === '6000_14999',
            maturity: a.AUDIT_TRACKING_MATURITY === 'disconnected',
            conversion: a.AUDIT_PRIMARY_CONVERSION === 'lead_form',
            problem: a.AUDIT_MEASUREMENT_PROBLEM === 'conflicting_numbers',
            urgency: a.AUDIT_URGENCY === 'before_scaling',
            status: a.AUDIT_STATUS === 'Applied',
            handoff: a.AUDIT_HANDOFF_STATUS === 'No Sales Handoff',
            leadSource: a.LEAD_SOURCE === 'tracking_audit_offer',
            source: a.SOURCE === 'Tracking Audit Landing Page',
            route: a.WEBSITE_ROUTE === '/offer/tracking-audit',
            offer: a.OFFER === 'tracking-audit',
            consent: a.CONSENT_STATUS === 'not_provided',
            utmSource: a.UTM_SOURCE === 'meta',
            utmMedium: a.UTM_MEDIUM === 'paid_social',
            utmCampaign: a.UTM_CAMPAIGN === 'tracking_audit_uat',
            utmContent: a.UTM_CONTENT === 'github_actions_browser_e2e',
            fbclid: a.FBCLID === 'uat-fbclid-20260831',
            taskApi: probe.tasks?.apiOk === true,
            taskCount: tasks.length === 1,
            taskOpen: tasks[0]?.done === false,
            taskNoDeal: !Array.isArray(tasks[0]?.dealsIds) || tasks[0].dealsIds.length === 0,
            applicantReceiptEvent: hasTag(applicantEvents, 'tracking_audit_receipt'),
            internalAuditEvent: hasTag(auditEvents, 'tracking_audit_offer'),
            internalMartechEvent: hasTag(martechEvents, 'tracking_audit_offer'),
          };

          console.log(JSON.stringify({ checks, contact: probe.contact, tasks: probe.tasks, emailEvents: probe.emailEvents }, null, 2));

          const failed = Object.entries(checks).filter(([, value]) => value !== true).map(([key]) => key);
          if (failed.length) {
            throw new Error(`UAT record verification failed: ${failed.join(', ')}`);
          }
          NODE

      - name: Upload record evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-audit-uat-record-verification
          if-no-files-found: error
          path: uat-record-evidence
