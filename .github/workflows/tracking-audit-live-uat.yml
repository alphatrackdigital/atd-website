name: Tracking Audit UAT Cleanup

on:
  push:
    branches:
      - qa/tracking-audit-live-uat-20260831

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_BASE_URL: https://atd-website-qa.alphatrackdigital.workers.dev

    steps:
      - name: Check out disposable UAT branch
        uses: actions/checkout@v4

      - name: Remove fixed Brevo UAT records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uat-cleanup-evidence
          STATUS="$(curl -sS -o uat-cleanup-evidence/cleanup.json -w '%{http_code}'             -X POST "$QA_BASE_URL/api/leads?atd_qa_cleanup=uat_records")"
          echo "cleanup_status=$STATUS"
          cat uat-cleanup-evidence/cleanup.json
          test "$STATUS" = "200"

          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('uat-cleanup-evidence/cleanup.json', 'utf8'));
          if (result.ok !== true) throw new Error('Fixed UAT cleanup did not complete.');
          const all = [...(result.taskResults || []), ...(result.contactResults || [])];
          const failed = all.filter((item) => item.ok !== true);
          if (failed.length) throw new Error('One or more fixed UAT records were not removed.');
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-audit-uat-cleanup
          if-no-files-found: error
          path: uat-cleanup-evidence
