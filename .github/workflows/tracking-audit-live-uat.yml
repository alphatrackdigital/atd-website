name: Tracking Audit Controlled Dedupe UAT

on:
  push:
    branches:
      - qa/tracking-audit-live-uat-20260831

permissions:
  contents: read

jobs:
  dedupe-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_BASE_URL: https://atd-website-qa.alphatrackdigital.workers.dev
      TEST_EMAIL: alphatrackdigital+tracking-audit-dedupe-uat-20260831@gmail.com

    steps:
      - name: Check out disposable UAT branch
        uses: actions/checkout@v4

      - name: Submit first application and immediate replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uat-dedupe-evidence

          cat > /tmp/first.json <<'JSON'
          {
            "source": "tracking_audit_offer",
            "firstName": "ATD",
            "lastName": "Dedupe UAT",
            "email": "alphatrackdigital+tracking-audit-dedupe-uat-20260831@gmail.com",
            "company": "ATD Tracking Audit Dedupe UAT",
            "websiteUrl": "https://alphatrack.digital",
            "industry": "professional_services",
            "role": "founder_ceo",
            "decisionInfluence": "final_decision_maker",
            "monthlyAdSpendBand": "6000_14999",
            "adPlatforms": ["meta_ads", "google_ads"],
            "trackingMaturity": "disconnected",
            "primaryConversionType": "lead_form",
            "measurementProblem": "conflicting_numbers",
            "urgency": "before_scaling",
            "optIn": false,
            "attribution": {
              "utmSource": "meta",
              "utmMedium": "paid_social",
              "utmCampaign": "tracking_audit_dedupe_uat",
              "utmContent": "github_actions_api_dedupe",
              "fbclid": "uat-dedupe-fbclid-20260831",
              "landingPage": "/offer/tracking-audit/?utm_source=meta&utm_medium=paid_social&utm_campaign=tracking_audit_dedupe_uat&utm_content=github_actions_api_dedupe&fbclid=uat-dedupe-fbclid-20260831"
            },
            "metaEventId": "atd-qa-dedupe-first-20260831"
          }
          JSON

          cat > /tmp/replay.json <<'JSON'
          {
            "source": "tracking_audit_offer",
            "firstName": "ATD",
            "lastName": "Dedupe UAT",
            "email": "alphatrackdigital+tracking-audit-dedupe-uat-20260831@gmail.com",
            "company": "ATD Tracking Audit Dedupe UAT",
            "websiteUrl": "https://alphatrack.digital",
            "industry": "professional_services",
            "role": "founder_ceo",
            "decisionInfluence": "final_decision_maker",
            "monthlyAdSpendBand": "6000_14999",
            "adPlatforms": ["meta_ads", "google_ads"],
            "trackingMaturity": "disconnected",
            "primaryConversionType": "lead_form",
            "measurementProblem": "conflicting_numbers",
            "urgency": "before_scaling",
            "optIn": false,
            "attribution": {
              "utmSource": "meta",
              "utmMedium": "paid_social",
              "utmCampaign": "tracking_audit_dedupe_uat",
              "utmContent": "github_actions_api_dedupe",
              "fbclid": "uat-dedupe-fbclid-20260831",
              "landingPage": "/offer/tracking-audit/?utm_source=meta&utm_medium=paid_social&utm_campaign=tracking_audit_dedupe_uat&utm_content=github_actions_api_dedupe&fbclid=uat-dedupe-fbclid-20260831"
            },
            "metaEventId": "atd-qa-dedupe-replay-20260831"
          }
          JSON

          FIRST_STATUS="$(curl -sS -o uat-dedupe-evidence/first-response.json -w '%{http_code}'             -X POST -H 'Content-Type: application/json' --data-binary @/tmp/first.json             "$QA_BASE_URL/api/leads")"
          echo "first_status=$FIRST_STATUS"
          cat uat-dedupe-evidence/first-response.json
          test "$FIRST_STATUS" = "200"

          sleep 2

          REPLAY_STATUS="$(curl -sS -o uat-dedupe-evidence/replay-response.json -w '%{http_code}'             -X POST -H 'Content-Type: application/json' --data-binary @/tmp/replay.json             "$QA_BASE_URL/api/leads")"
          echo "replay_status=$REPLAY_STATUS"
          cat uat-dedupe-evidence/replay-response.json
          test "$REPLAY_STATUS" = "200"

      - name: Verify duplicate semantics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const first = JSON.parse(fs.readFileSync('uat-dedupe-evidence/first-response.json', 'utf8'));
          const replay = JSON.parse(fs.readFileSync('uat-dedupe-evidence/replay-response.json', 'utf8'));

          const checks = {
            firstOk: first.ok === true,
            firstNotDuplicate: first.duplicate === false,
            firstConfirmed: first.pendingConfirmation === false,
            firstEventId: first.metaEventId === 'atd-qa-dedupe-first-20260831',
            replayOk: replay.ok === true,
            replayDuplicate: replay.duplicate === true,
            replayConfirmed: replay.pendingConfirmation === false,
            stableEventId: replay.metaEventId === first.metaEventId,
            replayDidNotReplaceEventId: replay.metaEventId !== 'atd-qa-dedupe-replay-20260831',
          };

          console.log(JSON.stringify({ checks, first, replay }, null, 2));
          const failed = Object.entries(checks).filter(([, value]) => value !== true).map(([key]) => key);
          if (failed.length) throw new Error(`Dedupe UAT failed: ${failed.join(', ')}`);
          NODE

      - name: Upload dedupe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-audit-controlled-dedupe-uat
          if-no-files-found: error
          path: uat-dedupe-evidence
