name: Tracking Audit visual QA

on:
  push:
    branches:
      - feature/general-tracking-audit-application

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive regression and capture visual QA screenshots
        run: npx playwright test e2e/tracking-audit.responsive.spec.ts e2e/_visual-qa.tracking-audit.spec.ts

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tracking-audit-visual-qa
          path: qa-artifacts/tracking-audit/*.png
          if-no-files-found: error
          retention-days: 3
